<!doctype html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XFRX8T94YG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XFRX8T94YG');

    // Formspree redirects here only after a successful send, so this is the reliable
    // "message sent" signal. Once per tab session so a reload doesn't double count.
    try {
      if (!sessionStorage.getItem('lead_sent')) {
        sessionStorage.setItem('lead_sent', '1');
        gtag('event', 'generate_lead', { form_id: 'contact', method: 'formspree' });
      }
    } catch (e) {
      gtag('event', 'generate_lead', { form_id: 'contact', method: 'formspree' });
    }
  </script>
  <meta charset="utf-8">
  <title>Cold Room Radio — ありがとうございます</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;400&display=swap" rel="stylesheet">
  <style>
    body {
      margin:0;display:flex;align-items:center;justify-content:center;
      height:100vh;background:#04060a;color:#fff;
      font-family:'Exo 2',sans-serif;text-align:center;
    }
    .box {
      max-width:600px;padding:24px;
      background:rgba(255,255,255,0.05);
      border-radius:12px;backdrop-filter:blur(10px);
    }
    a {color:#2bd1ea;text-decoration:none}
  </style>
</head>
<body>
  <div class="box">
    <h1>メッセージありがとうございます！</h1>
    <p>Cold Room Radioに届きました。<br>
      (番組でご紹介するかもしれません)</p>
    <p><a href="index.html">トップへ戻る</a></p>
  </div>
</body>
</html>
